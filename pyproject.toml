[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-financial-assistant"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.29,<1",
  "gunicorn>=22,<24",
  "uvicorn-worker>=0.3,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.43,<2",
  "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*", "ai*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
