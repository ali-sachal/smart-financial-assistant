[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-fastapi-platform"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.29,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "PyJWT>=2.10,<3",
  "cryptography>=43,<47",
  "requests>=2.31,<3",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
billing = ["stripe>=12,<16", "playwright>=1.55,<2"]
documents = ["pdf2docx>=0.5.8", "python-docx>=1.1", "PyMuPDF>=1.24", "pillow>=10.4"]
aws = ["boto3>=1.35,<2"]
events = ["aiokafka>=0.12,<1"]
ai = ["google-generativeai>=0.8,<1", "litellm>=1.60,<2", "pillow>=10.4"]
dev = ["pytest>=8.4,<9", "httpx>=0.27,<1"]
all = [
  "stripe>=12,<16", "playwright>=1.55,<2", "pdf2docx>=0.5.8",
  "python-docx>=1.1", "PyMuPDF>=1.24", "pillow>=10.4",
  "boto3>=1.35,<2", "aiokafka>=0.12,<1",
  "google-generativeai>=0.8,<1", "litellm>=1.60,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "ai*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
